<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="50%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1e293b" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1e293b" stroke-width="1"/>

  <!-- Logo icon -->
  <rect x="516" y="165" width="64" height="64" rx="14" fill="#4338ca"/>
  <text x="548" y="208" font-size="32" text-anchor="middle" fill="white" font-family="sans-serif">🖼</text>

  <!-- Brand name -->
  <text x="600" y="308" font-size="88" font-weight="900" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',sans-serif" fill="url(#brand)" letter-spacing="-2">SlimPic</text>

  <!-- Tagline -->
  <text x="600" y="368" font-size="28" font-weight="400" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',sans-serif" fill="#94a3b8">
    이미지 변환 · WebP 변환 · 이미지 용량 줄이기
  </text>

  <!-- Keywords chips -->
  <rect x="230" y="410" width="160" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="310" y="434" font-size="16" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif">이미지 변환</text>

  <rect x="410" y="410" width="160" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="490" y="434" font-size="16" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif">WebP 변환</text>

  <rect x="590" y="410" width="200" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="690" y="434" font-size="16" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif">이미지 용량 줄이기</text>

  <rect x="810" y="410" width="160" height="38" rx="19" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
  <text x="890" y="434" font-size="16" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif">무료 · 안전</text>

  <!-- Domain -->
  <text x="600" y="530" font-size="20" text-anchor="middle" fill="#475569" font-family="sans-serif">
    slimpic.startuprecipe.co.kr
  </text>

  <!-- Bottom border accent -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#brand)"/>
</svg>
